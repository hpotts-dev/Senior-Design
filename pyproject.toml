[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-diagnostics"
version = "0.1.0"
description = "Low-latency three-camera Basler beam diagnostics and nominal PID framework"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<6"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6,<6.13"]
basler = ["pypylon>=26.8,<27"]

[tool.setuptools.packages.find]
include = ["beamdiag*"]
